name: build-and-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
          python-version: ${{ matrix.python }}
      # Run scripts/bootstrap.py and commit uv.lock before enabling this locked CI.
      - run: uv sync --locked --all-groups
      - run: uv run --locked --all-groups python scripts/verify.py
      - run: uv build
      - name: Execute notebooks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --locked --all-groups python scripts/run_notebooks.py
